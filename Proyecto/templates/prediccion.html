<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predicción de vacunación</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon/dog2.webp') }}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/estilo.css') }}" rel="stylesheet">
</head>

<body>
    <header>
        <h1 class="text-center">Predicción de Vacunación</h1>
    </header>
<nav class="navbar navbar-expand-lg navbar-dark bg-success" style="max-width: 1000px; margin-bottom: 20px !important; padding:10px; margin: 0 auto; border-radius: 10px;">
        <div class="container">
            <div class="collapse navbar-collapse " id="navbarNav">
                <ul class="navbar-nav w-100 justify-content-around ">
                    <li class="nav-item centro-vertical"> <a class="nav-link custom-nav nav-link-inicio-destacado" style="padding: 0.3rem 5em;"
                            href="{{ url_for('home') }}">Inicio</a></li>
                    <li class="nav-item centro-vertical"> <a class="nav-link custom-nav" style="padding: 0.3rem 5em;"
                            href="{{ url_for('implementacion') }}">Evaluación del modelo</a></li>
                    <li class="nav-item centro-vertical"> <a class="nav-link custom-nav" style="padding: 0.3rem 5em;"
                            href="{{ url_for('historial') }}">Historial</a></li>
                </ul>
            </div>
        </div>
    </nav>
    {% if resultado %}
    <div class="container mt-5 text-center">
        <h3 style="font-size: x-large;">{{ resultado }}</h3>
    </div><br>
    {% endif %}
    <div class="container" id="formulario">
        <h2>Formulario de Predicción de Vacunación</h2>
        <p class="text-left">Ingrese los datos para predecir la cantidad de vacunaciones necesarias.</p>
        <form method="POST" action="/predecir">
            <strong>Año:</strong>
            <input type="number" class="form-control text-center" name="año" min="2024" required>

            <strong>Mes:</strong>
            <select name="mes" class="form-select text-center" required>
                <option value="1">Enero</option>
                <option value="2">Febrero</option>
                <option value="3">Marzo</option>
                <option value="4">Abril</option>
                <option value="5">Mayo</option>
                <option value="6">Junio</option>
                <option value="7">Julio</option>
                <option value="8">Agosto</option>
                <option value="9">Septiembre</option>
                <option value="10">Octubre</option>
                <option value="11">Noviembre</option>
                <option value="12">Diciembre</option>
            </select>

            <strong>Zona:</strong>
            <select name="urbano" class="form-select text-center" required>
                <option value="1">Urbano</option>
                <option value="0">Rural</option>
            </select>

            <strong>Tipo de punto:</strong>
            <select class="form-select text-center" name="tipo_punto" required>
                <option value="0">Vivienda</option>
                <option value="1">Punto fijo</option>
            </select>


            <strong>Sector:</strong>
            <select class="form-select text-center" name="sector" required>
                <option value="0">Cerca de pedra</option>
                <option value="1">Centro</option>
                <option value="2">La Balsa</option>
                <option value="3">Tiquiza</option>
                <option value="4">Fonqueta</option>
                <option value="5">Fusca</option>
                <option value="6">Fagua</option>
                <option value="7">Samaria</option>
                <option value="8">Otro</option>
            </select>


            <button type="submit" class="btn btn-success">Predecir</button>
        </form>

    </div>
</body>

</html>
